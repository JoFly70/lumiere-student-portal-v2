<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumière Student Portal</title>
    <meta name="description" content="Lumière Student Portal: your academic pathway, documents, support requests and billing in one secure place, in English and French." />
    <!-- Flash-free theme bootstrap (S17): applies the saved theme before first paint. Mirrors lib/themes.ts. -->
    <script>
      (function () {
        try {
          var ids = { lumiere: 0, "lumiere-dark": 1, midnight: 1, monaco: 1, forest: 1, bordeaux: 1, graphite: 1, sandstone: 0, teal: 1 };
          var v = null;
          try { v = localStorage.getItem("lumiere-portal:theme") || localStorage.getItem("theme"); } catch (e) {}
          if (v === "dark") v = "lumiere-dark"; else if (v === "light") v = null;
          if (!v || !Object.prototype.hasOwnProperty.call(ids, v)) v = "lumiere";
          var r = document.documentElement;
          r.setAttribute("data-theme", v);
          r.classList.remove("light", "dark");
          r.classList.add(ids[v] ? "dark" : "light");
          r.style.colorScheme = ids[v] ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
